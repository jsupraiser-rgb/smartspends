<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpends - Minimalist Budget Planner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-blue);
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .card.full {
            grid-column: span 2;
        }
        .card h3 {
            margin: 0 0 6px 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .card p {
            margin: 0;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .income { color: var(--accent-green); }
        .expense { color: var(--accent-red); }
        
        form {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .transaction-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .transaction-item {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        .transaction-info span {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SmartSpends</h1>

    <div class="dashboard">
        <div class="card full">
            <h3>Total Balance</h3>
            <p id="totalBalance">$0.00</p>
        </div>
        <div class="card">
            <h3>Income</h3>
            <p id="totalIncome" class="income">$0.00</p>
        </div>
        <div class="card">
            <h3>Expenses</h3>
            <p id="totalExpense" class="expense">$0.00</p>
        </div>
    </div>

    <form id="transactionForm">
        <input type="text" id="title" placeholder="Description (e.g., Grocery)" required>
        <input type="number" id="amount" placeholder="Amount ($)" step="0.01" required>
        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <button type="submit">Add Transaction</button>
    </form>

    <ul id="transactionList" class="transaction-list"></ul>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('smart_spends')) || [];

    const form = document.getElementById('transactionForm');
    const titleInput = document.getElementById('title');
    const amountInput = document.getElementById('amount');
    const typeInput = document.getElementById('type');
    const transactionList = document.getElementById('transactionList');
    const totalBalance = document.getElementById('totalBalance');
    const totalIncome = document.getElementById('totalIncome');
    const totalExpense = document.getElementById('totalExpense');

    function updateUI() {
        transactionList.innerHTML = '';
        let income = 0;
        let expense = 0;

        transactions.forEach((t) => {
            const li = document.createElement('li');
            li.className = 'transaction-item';
            li.innerHTML = `
                <div class="transaction-info">
                    <strong>${t.title}</strong>
                    <span>${t.type.toUpperCase()}</span>
                </div>
                <div style="color: ${t.type === 'income' ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: bold;">
                    ${t.type === 'income' ? '+' : '-'}$${parseFloat(t.amount).toFixed(2)}
                </div>
            `;
            transactionList.appendChild(li);

            if (t.type === 'income') {
                income += parseFloat(t.amount);
            } else {
                expense += parseFloat(t.amount);
            }
        });

        let balance = income - expense;
        totalBalance.textContent = `$${balance.toFixed(2)}`;
        totalIncome.textContent = `+$${income.toFixed(2)}`;
        totalExpense.textContent = `-$${expense.toFixed(2)}`;

        localStorage.setItem('smart_spends', JSON.stringify(transactions));
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const newTransaction = {
            title: titleInput.value,
            amount: amountInput.value,
            type: typeInput.value
        };
        transactions.push(newTransaction);
        titleInput.value = '';
        amountInput.value = '';
        updateUI();
    });

    updateUI();
</script>

</body>
</html>
