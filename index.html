<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpends - Budget & Expense Manager</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #34d399;
            --accent-red: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding-bottom: 90px; /* Space for floating bar */
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--accent-gold);
        }
        .lang-select {
            background-color: #090d16;
            color: var(--accent-gold);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
        }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .balance-amount {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 8px 0;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .stat-item {
            text-align: center;
            flex: 1;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .stat-val {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 4px;
        }
        .box {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            display: block;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #090d16;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
        }
        .transaction-item {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        /* Floating Bottom Toolbar */
        .floating-toolbar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 360px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .tool-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .tool-btn.active {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <h1 id="appTitle">SmartSpends</h1>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="ar">العربية</option>
        </select>
    </div>

    <!-- Balance Summary Card -->
    <div class="balance-card">
        <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;" id="lblTotalBalance">Total Balance</div>
        <div class="balance-amount" id="netBalance">$0.00</div>
        <div class="stats-row">
            <div class="stat-item" style="border-right: 1px solid var(--border-color);">
                <div class="stat-label" id="lblIncome">Income</div>
                <div class="stat-val" id="totalIncome" style="color: var(--accent-green);">+$0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label" id="lblExpenses">Expenses</div>
                <div class="stat-val" id="totalExpenses" style="color: var(--accent-red);">-$0.00</div>
            </div>
        </div>
    </div>

    <!-- Add Transaction Box -->
    <div class="box">
        <label id="lblTxType">Transaction Type</label>
        <select id="txTypeInput">
            <option value="income">Income (+)</option>
            <option value="expense" selected>Expense (-)</option>
        </select>

        <label id="lblTxName">Description</label>
        <input type="text" id="txNameInput" placeholder="e.g. Salary, Groceries">

        <label id="lblTxAmount">Amount</label>
        <input type="number" id="txAmountInput" placeholder="e.g. 150" step="any" required>

        <button class="action-btn" onclick="addTransaction()" id="addTxBtn">Add Transaction</button>
    </div>

    <!-- Transaction History List -->
    <div style="font-size: 0.85rem; font-weight: bold; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase;" id="lblHistory">Transaction History</div>
    <div id="transactionListContainer"></div>
</div>

<!-- Floating Bottom Toolbar -->
<div class="floating-toolbar">
    <button class="tool-btn active" onclick="scrollToTop()">
        <span>🏠</span>
        <span id="navHome">Home</span>
    </button>
    <button class="tool-btn" onclick="focusInput()">
        <span>➕</span>
        <span id="navAdd">Add</span>
    </button>
    <button class="tool-btn" onclick="clearData()">
        <span>🗑️</span>
        <span id="navClear">Reset</span>
    </button>
</div>

<script>
    let currentLang = localStorage.getItem('smart_spends_lang') || 'en';
    document.getElementById('langSelect').value = currentLang;

    let transactions = JSON.parse(localStorage.getItem('smart_spends_data')) || [
        { name: 'Monthly Salary', amount: 2500, type: 'income' },
        { name: 'Groceries & Supplies', amount: 85, type: 'expense' }
    ];

    const translations = {
        en: {
            title: "SmartSpends",
            lblTotalBalance: "Total Balance",
            lblIncome: "Income",
            lblExpenses: "Expenses",
            lblTxType: "Transaction Type",
            lblTxName: "Description",
            lblTxAmount: "Amount",
            addTxBtn: "Add Transaction",
            lblHistory: "Transaction History",
            navHome: "Home",
            navAdd: "Add",
            navClear: "Reset"
        },
        hi: {
            title: "स्मार्ट स्पेंड्स",
            lblTotalBalance: "कुल शेष राशि",
            lblIncome: "आय",
            lblExpenses: "खर्च",
            lblTxType: "लेनदेन का प्रकार",
            lblTxName: "विवरण",
            lblTxAmount: "राशि",
            addTxBtn: "लेनदेन जोड़ें",
            lblHistory: "लेनदेन का इतिहास",
            navHome: "होम",
            navAdd: "जोड़ें",
            navClear: "रीसेट"
        },
        ar: {
            title: "المصروف الذكي",
            lblTotalBalance: "إجمالي الرصيد",
            lblIncome: "الدخل",
            lblExpenses: "المصروفات",
            lblTxType: "نوع المعاملة",
            lblTxName: "الوصف",
            lblTxAmount: "المبلغ",
            addTxBtn: "إضافة معاملة",
            lblHistory: "سجل المعاملات",
            navHome: "الرئيسية",
            navAdd: "إضافة",
            navClear: "إعادة ضبط"
        }
    };

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('smart_spends_lang', lang);
        applyTranslations();
    }

    function applyTranslations() {
        let t = translations[currentLang] || translations['en'];
        document.getElementById('appTitle').textContent = t.title;
        document.getElementById('lblTotalBalance').textContent = t.lblTotalBalance;
        document.getElementById('lblIncome').textContent = t.lblIncome;
        document.getElementById('lblExpenses').textContent = t.lblExpenses;
        document.getElementById('lblTxType').textContent = t.lblTxType;
        document.getElementById('lblTxName').textContent = t.lblTxName;
        document.getElementById('lblTxAmount').textContent = t.lblTxAmount;
        document.getElementById('addTxBtn').textContent = t.addTxBtn;
        document.getElementById('lblHistory').textContent = t.lblHistory;
        document.getElementById('navHome').textContent = t.navHome;
        document.getElementById('navAdd').textContent = t.navAdd;
        document.getElementById('navClear').textContent = t.navClear;
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function focusInput() {
        document.getElementById('txNameInput').focus();
    }

    function clearData() {
        if (confirm(currentLang === 'hi' ? 'क्या आप सभी डेटा रीसेट करना चाहते हैं?' : 'Are you sure you want to reset all data?')) {
            transactions = [];
            updateUI();
        }
    }

    function addTransaction() {
        let name = document.getElementById('txNameInput').value.trim();
        let amount = parseFloat(document.getElementById('txAmountInput').value);
        let type = document.getElementById('txTypeInput').value;

        if (!name || isNaN(amount) || amount <= 0) {
            alert(currentLang === 'hi' ? 'कृपया सही मान दर्ज करें' : 'Please enter valid transaction details');
            return;
        }

        transactions.unshift({ name, amount, type });
        document.getElementById('txNameInput').value = '';
        document.getElementById('txAmountInput').value = '';
        updateUI();
    }

    function deleteTransaction(index) {
        transactions.splice(index, 1);
        updateUI();
    }

    function updateUI() {
        let income = 0;
        let expenses = 0;
        let html = '';

        transactions.forEach((tx, idx) => {
            if (tx.type === 'income') {
                income += tx.amount;
            } else {
                expenses += tx.amount;
            }

            html += `
                <div class="transaction-item">
                    <div>
                        <strong style="font-size: 0.95rem; display: block;">${tx.name}</strong>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-weight: bold; color: ${tx.type === 'income' ? 'var(--accent-green)' : 'var(--accent-red)'};">
                            ${tx.type === 'income' ? '+' : '-'}$${tx.amount.toFixed(2)}
                        </span>
                        <button onclick="deleteTransaction(${idx})" style="background: #ef4444; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;">✕</button>
                    </div>
                </div>
            `;
        });

        let balance = income - expenses;
        document.getElementById('netBalance').textContent = `$${balance.toFixed(2)}`;
        document.getElementById('totalIncome').textContent = `+$${income.toFixed(2)}`;
        document.getElementById('totalExpenses').textContent = `-$${expenses.toFixed(2)}`;

        document.getElementById('transactionListContainer').innerHTML = html || '<p style="text-align:center; color:#94a3b8; font-size:0.85rem;">No transactions recorded.</p>';
        localStorage.setItem('smart_spends_data', JSON.stringify(transactions));
    }

    applyTranslations();
    updateUI();
</script>

</body>
</html>
