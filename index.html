<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpends - Budget & Expense Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #34d399;
            --accent-red: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding-bottom: 60px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--accent-gold);
        }
        .controls-group {
            display: flex;
            gap: 6px;
        }
        .select-box {
            background-color: #090d16;
            color: var(--accent-gold);
            border: 1px solid var(--border-color);
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
        }
        /* Dashboard Summary Cards */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .dash-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .dash-title {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .dash-val {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
        }
        .box {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            display: block;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #090d16;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.9rem;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
        }
        .transaction-item {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <h1 id="appTitle">SmartSpends</h1>
        <div class="controls-group">
            <select id="currencySelect" class="select-box" onchange="changeCurrency(this.value)">
                <option value="$">$ USD</option>
                <option value="₹">₹ INR</option>
                <option value="€">€ EUR</option>
                <option value="£">£ GBP</option>
            </select>
            <select id="langSelect" class="select-box" onchange="changeLanguage(this.value)">
                <option value="en">EN</option>
                <option value="hi">HI</option>
                <option value="ar">AR</option>
            </select>
        </div>
    </div>

    <!-- Dashboard Summary -->
    <div class="dashboard-grid">
        <div class="dash-card">
            <div class="dash-title" id="lblTotalSpent">Total Spent</div>
            <div class="dash-val" id="totalSpentVal">$0.00</div>
        </div>
        <div class="dash-card">
            <div class="dash-title" id="lblBudgetStatus">Budget Limit</div>
            <div class="dash-val" id="budgetLimitVal" style="color: var(--accent-green);">Set Limit</div>
        </div>
    </div>

    <!-- Add Transaction Box -->
    <div class="box">
        <label id="lblTxName">Transaction Title</label>
        <input type="text" id="txNameInput" placeholder="e.g. Groceries, Coffee">

        <label id="lblTxAmount">Amount</label>
        <input type="number" id="txAmountInput" placeholder="e.g. 25.50" step="any">

        <label id="lblTxCategory">Category</label>
        <select id="txCategoryInput">
            <option value="Food">🍔 Food & Dining</option>
            <option value="Bills">💡 Bills & Utilities</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Other">📦 Other</option>
        </select>

        <button class="action-btn" onclick="addTransaction()" id="addTxBtn">Add Expense</button>
    </div>

    <!-- Budget Limit Manager -->
    <div class="box" style="padding: 12px;">
        <label id="lblSetBudget">Set Monthly Budget Limit</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="budgetInput" placeholder="e.g. 500" style="margin-bottom:0;">
            <button class="action-btn" onclick="saveBudget()" id="saveBudgetBtn" style="width: 100px; padding: 0; font-size: 0.85rem;">Save</button>
        </div>
    </div>

    <!-- Transaction History List -->
    <div style="font-size: 0.85rem; font-weight: bold; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase;" id="lblHistory">Recent Transactions</div>
    <div id="transactionListContainer"></div>
</div>

<script>
    let currentLang = localStorage.getItem('smart_spends_lang') || 'en';
    let currentCurrency = localStorage.getItem('smart_spends_curr') || '$';
    let monthlyBudget = parseFloat(localStorage.getItem('smart_spends_budget')) || 0;
    
    document.getElementById('langSelect').value = currentLang;
    document.getElementById('currencySelect').value = currentCurrency;

    let transactions = JSON.parse(localStorage.getItem('smart_spends_list')) || [
        { name: 'Coffee & Snacks', amount: 5.50, category: 'Food', date: 'Today' },
        { name: 'Monthly Internet', amount: 45.00, category: 'Bills', date: 'Yesterday' }
    ];

    const translations = {
        en: {
            title: "SmartSpends",
            lblTotalSpent: "Total Spent",
            lblBudgetStatus: "Budget Limit",
            lblTxName: "Transaction Title",
            lblTxAmount: "Amount",
            lblTxCategory: "Category",
            addTxBtn: "Add Expense",
            lblSetBudget: "Set Monthly Budget Limit",
            saveBudgetBtn: "Save",
            lblHistory: "Recent Transactions"
        },
        hi: {
            title: "स्मार्ट स्पेंड्स",
            lblTotalSpent: "कुल खर्च",
            lblBudgetStatus: "बजट सीमा",
            lblTxName: "लेनदेन का नाम",
            lblTxAmount: "राशि",
            lblTxCategory: "श्रेणी",
            addTxBtn: "खर्च जोड़ें",
            lblSetBudget: "मासिक बजट सीमा सेट करें",
            saveBudgetBtn: "सहेजें",
            lblHistory: "हाल के लेन-देन"
        },
        ar: {
            title: "المصروف الذكي",
            lblTotalSpent: "إجمالي المصروفات",
            lblBudgetStatus: "حد الميزانية",
            lblTxName: "عنوان المعاملة",
            lblTxAmount: "المبلغ",
            lblTxCategory: "الفئة",
            addTxBtn: "إضافة مصروف",
            lblSetBudget: "تعيين حد الميزانية الشهرية",
            saveBudgetBtn: "حفظ",
            lblHistory: "المعاملات الأخيرة"
        }
    };

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('smart_spends_lang', lang);
        applyTranslations();
    }

    function changeCurrency(curr) {
        currentCurrency = curr;
        localStorage.setItem('smart_spends_curr', curr);
        updateUI();
    }

    function applyTranslations() {
        let t = translations[currentLang] || translations['en'];
        document.getElementById('appTitle').textContent = t.title;
        document.getElementById('lblTotalSpent').textContent = t.lblTotalSpent;
        document.getElementById('lblBudgetStatus').textContent = t.lblBudgetStatus;
        document.getElementById('lblTxName').textContent = t.lblTxName;
        document.getElementById('lblTxAmount').textContent = t.lblTxAmount;
        document.getElementById('lblTxCategory').textContent = t.lblTxCategory;
        document.getElementById('addTxBtn').textContent = t.addTxBtn;
        document.getElementById('lblSetBudget').textContent = t.lblSetBudget;
        document.getElementById('saveBudgetBtn').textContent = t.saveBudgetBtn;
        document.getElementById('lblHistory').textContent = t.lblHistory;
    }

    function saveBudget() {
        let val = parseFloat(document.getElementById('budgetInput').value);
        if (!isNaN(val)) {
            monthlyBudget = val;
            localStorage.setItem('smart_spends_budget', monthlyBudget);
            document.getElementById('budgetInput').value = '';
            updateUI();
        }
    }

    function addTransaction() {
        let name = document.getElementById('txNameInput').value.trim();
        let amount = parseFloat(document.getElementById('txAmountInput').value);
        let category = document.getElementById('txCategoryInput').value;

        if (!name || isNaN(amount) || amount <= 0) {
            alert(currentLang === 'hi' ? 'कृपया सही विवरण दर्ज करें' : 'Please enter valid transaction details');
            return;
        }

        transactions.unshift({ name, amount, category, date: 'Just now' });
        document.getElementById('txNameInput').value = '';
        document.getElementById('txAmountInput').value = '';
        updateUI();
    }

    function deleteTransaction(index) {
        transactions.splice(index, 1);
        updateUI();
    }

    function updateUI() {
        let totalSpent = transactions.reduce((sum, tx) => sum + tx.amount, 0);
        document.getElementById('totalSpentVal').textContent = `${currentCurrency}${totalSpent.toFixed(2)}`;

        let limitEl = document.getElementById('budgetLimitVal');
        if (monthlyBudget > 0) {
            limitEl.textContent = `${currentCurrency}${monthlyBudget}`;
            if (totalSpent > monthlyBudget) {
                limitEl.style.color = 'var(--accent-red)';
            } else {
                limitEl.style.color = 'var(--accent-green)';
            }
        } else {
            limitEl.textContent = currentLang === 'hi' ? 'कोई सीमा नहीं' : 'No Limit';
        }

        let html = '';
        transactions.forEach((tx, idx) => {
            html += `
                <div class="transaction-item">
                    <div>
                        <strong style="font-size: 0.95rem; display:block;">${tx.name}</strong>
                        <span style="color: #94a3b8; font-size: 0.75rem;">${tx.category} • ${tx.date}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-weight: bold; color: var(--accent-red);">-${currentCurrency}${tx.amount.toFixed(2)}</span>
                        <button onclick="deleteTransaction(${idx})" style="background: #ef4444; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;">✕</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('transactionListContainer').innerHTML = html || '<p style="text-align:center; color:#94a3b8; font-size:0.85rem;">No transactions recorded.</p>';
        localStorage.setItem('smart_spends_list', JSON.stringify(transactions));
    }

    applyTranslations();
    updateUI();
</script>

</body>
</html>
